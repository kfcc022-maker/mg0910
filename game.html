<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>Pixel Jump Adventure</title>
  <style>
    :root{
      --ink:#172033;
      --panel:rgba(255,255,255,.9);
      --shadow:0 12px 32px rgba(0,0,0,.22);
    }
    *{box-sizing:border-box}
    html,body{margin:0;height:100%;background:#09142f;color:var(--ink);font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;overflow:hidden}
    body{display:grid;place-items:center}
    .wrap{position:relative;width:min(100vw,1200px);height:min(100vh,720px);background:#73c9ff;overflow:hidden;box-shadow:var(--shadow)}
    canvas{display:block;width:100%;height:100%;image-rendering:pixelated;touch-action:none}
    .topbar{position:absolute;inset:14px 14px auto 14px;display:flex;gap:10px;align-items:center;justify-content:space-between;pointer-events:none}
    .home-link{position:absolute;left:14px;bottom:14px;z-index:20;display:inline-flex;align-items:center;gap:6px;padding:10px 14px;border-radius:12px;background:rgba(255,255,255,.92);color:#172033;text-decoration:none;font-weight:900;border:2px solid rgba(23,32,51,.18);box-shadow:0 5px 16px rgba(0,0,0,.18);backdrop-filter:blur(4px)}
    .home-link:hover{transform:translateY(-1px);background:#fff}
    .stats{display:flex;gap:8px;flex-wrap:wrap}
    .chip{background:var(--panel);padding:8px 11px;border:2px solid rgba(23,32,51,.18);border-radius:12px;font-weight:800;box-shadow:0 4px 12px rgba(0,0,0,.12);backdrop-filter:blur(4px)}
    .hint{background:rgba(20,32,54,.82);color:white;padding:8px 12px;border-radius:10px;font-size:13px;font-weight:700}
    .overlay{position:absolute;inset:0;display:grid;place-items:center;background:linear-gradient(rgba(7,17,40,.28),rgba(7,17,40,.56));padding:20px}
    .card{width:min(560px,94%);background:rgba(255,255,255,.95);border-radius:22px;padding:28px;text-align:center;box-shadow:0 24px 60px rgba(0,0,0,.28);border:3px solid rgba(255,255,255,.75)}
    .card h1{margin:0 0 8px;font-size:clamp(30px,6vw,56px);line-height:1;color:#e84040;text-shadow:3px 3px 0 #ffd34f}
    .card p{margin:8px 0 18px;line-height:1.55;color:#40506c}
    button{border:0;border-radius:14px;padding:13px 18px;font-weight:900;font-size:16px;cursor:pointer;background:#1f78ff;color:#fff;box-shadow:0 6px 0 #1553aa;transition:.08s transform,.08s box-shadow}
    button:active{transform:translateY(4px);box-shadow:0 2px 0 #1553aa}
    .mobile{position:absolute;left:0;right:0;bottom:16px;display:none;justify-content:space-between;padding:0 18px;pointer-events:none}
    .pad{display:flex;gap:12px;pointer-events:auto}
    .mkey{width:64px;height:64px;border-radius:20px;background:rgba(255,255,255,.82);border:2px solid rgba(23,32,51,.18);display:grid;place-items:center;font-size:28px;font-weight:900;user-select:none;touch-action:none;box-shadow:0 5px 14px rgba(0,0,0,.18)}
    .jump{width:78px;height:78px;border-radius:50%;background:rgba(255,215,71,.92);font-size:18px}
    .small{font-size:12px;color:#667085;margin-top:10px}
    @media (max-width:820px), (pointer:coarse){.mobile{display:flex}.hint{display:none}.topbar{top:8px;left:8px;right:8px}.chip{padding:6px 8px;font-size:13px}}
  </style>
</head>
<body>
  <div class="wrap" id="wrap">
    <canvas id="game" width="960" height="540" aria-label="횡스크롤 점프 게임"></canvas>
    <a class="home-link" href="./index.html" aria-label="메인 페이지로 이동">← 메인으로</a>

    <div class="topbar">
      <div class="stats">
        <div class="chip">점수 <span id="score">000000</span></div>
        <div class="chip">코인 <span id="coins">0</span></div>
        <div class="chip">목숨 <span id="lives">3</span></div>
      </div>
      <div class="hint">← → / A D 이동 · Space / W / ↑ 점프 · R 재시작</div>
    </div>

    <div class="overlay" id="overlay">
      <div class="card">
        <h1>PIXEL JUMP</h1>
        <p>달리고, 높이 점프해 벽돌 위로 올라가 코인을 모은 뒤 깃발까지 도착하세요.<br>적은 위에서 밟으면 처치할 수 있습니다.</p>
        <button id="startBtn">게임 시작</button>
        <div class="small">원작 에셋을 사용하지 않은 오리지널 브라우저 플랫폼 게임</div>
      </div>
    </div>

    <div class="mobile">
      <div class="pad">
        <div class="mkey" data-key="left">◀</div>
        <div class="mkey" data-key="right">▶</div>
      </div>
      <div class="pad">
        <div class="mkey jump" data-key="jump">JUMP</div>
      </div>
    </div>
  </div>

<script>
(() => {
  'use strict';

  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');
  const overlay = document.getElementById('overlay');
  const startBtn = document.getElementById('startBtn');
  const scoreEl = document.getElementById('score');
  const coinsEl = document.getElementById('coins');
  const livesEl = document.getElementById('lives');

  const W = canvas.width;
  const H = canvas.height;
  const TILE = 48;
  const GRAVITY = 0.72;
  const JUMP_SPEED = -17.8; // 벽돌 위에 안정적으로 올라갈 수 있도록 상향
  const JUMP_RELEASE_CUT = 0.32; // 짧게 눌러도 점프 높이가 지나치게 줄지 않도록 완화
  const MAX_FALL = 15;
  const worldWidth = 6100;

  let gameState = 'menu';
  let score = 0;
  let coinCount = 0;
  let lives = 3;
  let cameraX = 0;
  let last = performance.now();
  let t = 0;
  let shake = 0;

  const keys = { left:false, right:false, jump:false, jumpPressed:false };

  const palette = {
    sky1:'#68c8ff', sky2:'#d9f3ff', cloud:'#ffffff', hill:'#62c67d', hill2:'#4daf66',
    ground:'#9b5f35', grass:'#3fb34f', brick:'#cf6d35', brickDark:'#8f3e25',
    question:'#f6bd35', questionDark:'#b87c18', coin:'#ffd84a', coin2:'#f4a928',
    ink:'#24304a', white:'#fff', red:'#e7463f', blue:'#3478dd', skin:'#ffd1a1',
    enemy:'#6f4a32', enemy2:'#2e2443', flag:'#f8f8f8', pole:'#d7dce8'
  };

  const level = {
    platforms: [
      {x:0,y:462,w:980,h:78,type:'ground'},
      {x:1080,y:462,w:700,h:78,type:'ground'},
      {x:1880,y:462,w:1050,h:78,type:'ground'},
      {x:3050,y:462,w:640,h:78,type:'ground'},
      {x:3790,y:462,w:980,h:78,type:'ground'},
      {x:4880,y:462,w:1220,h:78,type:'ground'},

      {x:380,y:350,w:144,h:48,type:'brick'},
      {x:570,y:292,w:48,h:48,type:'question'},
      {x:665,y:350,w:144,h:48,type:'brick'},
      {x:1210,y:360,w:144,h:48,type:'brick'},
      {x:1420,y:295,w:144,h:48,type:'brick'},
      {x:1640,y:235,w:96,h:48,type:'question'},
      {x:1990,y:354,w:144,h:48,type:'brick'},
      {x:2220,y:300,w:48,h:48,type:'question'},
      {x:2380,y:246,w:192,h:48,type:'brick'},
      {x:2730,y:334,w:96,h:48,type:'brick'},
      {x:3150,y:330,w:144,h:48,type:'brick'},
      {x:3390,y:260,w:144,h:48,type:'question'},
      {x:3920,y:355,w:192,h:48,type:'brick'},
      {x:4220,y:290,w:96,h:48,type:'question'},
      {x:4490,y:235,w:192,h:48,type:'brick'},
      {x:5030,y:350,w:96,h:48,type:'brick'},
      {x:5260,y:290,w:144,h:48,type:'question'},
      {x:5550,y:220,w:192,h:48,type:'brick'},
      {x:5790,y:160,w:144,h:48,type:'brick'}
    ],
    coins: [],
    enemies: [],
    flag: {x:5960,y:172,h:290}
  };

  const coinSpots = [
    [420,300],[468,300],[594,235],[712,300],[760,300],
    [1155,410],[1250,310],[1300,310],[1455,245],[1503,245],[1688,185],
    [2040,305],[2088,305],[2244,250],[2420,195],[2470,195],[2520,195],
    [2790,285],[3190,280],[3240,280],[3430,210],[3480,210],
    [3970,305],[4020,305],[4070,305],[4260,240],[4540,185],[4590,185],[4640,185],
    [5075,300],[5300,240],[5350,240],[5600,170],[5650,170],[5700,170],[5850,110]
  ];

  const enemySpots = [
    [780,420,-1],[1260,420,1],[1530,420,-1],[2050,420,1],[2640,420,-1],
    [3260,420,1],[4040,420,-1],[4350,420,1],[5010,420,-1],[5450,420,1]
  ];

  class Player {
    constructor(){ this.reset(true); }
    reset(full=false){
      this.x = full ? 100 : Math.max(100, this.checkpoint || 100);
      this.y = 360;
      this.w = 34;
      this.h = 44;
      this.vx = 0;
      this.vy = 0;
      this.onGround = false;
      this.facing = 1;
      this.coyote = 0;
      this.jumpBuffer = 0;
      this.invincible = 0;
      this.dead = false;
      this.checkpoint = this.x;
    }
  }

  const player = new Player();

  function resetLevel(keepScore=false){
    if (!keepScore){score=0; coinCount=0; lives=3;}
    level.coins = coinSpots.map(([x,y],i)=>({x,y,r:11,collected:false,bob:i*0.73}));
    level.enemies = enemySpots.map(([x,y,dir])=>({x,y,w:38,h:34,vx:dir*1.15,alive:true,baseY:y}));
    player.reset(true);
    cameraX = 0;
    shake = 0;
    updateHud();
  }

  function updateHud(){
    scoreEl.textContent = String(score).padStart(6,'0');
    coinsEl.textContent = coinCount;
    livesEl.textContent = lives;
  }

  function rectsOverlap(a,b){
    return a.x < b.x+b.w && a.x+a.w > b.x && a.y < b.y+b.h && a.y+a.h > b.y;
  }

  function resolvePlayerPlatforms(prevX, prevY){
    player.onGround = false;
    for (const p of level.platforms){
      if (!rectsOverlap(player,p)) continue;
      const prevBottom = prevY + player.h;
      const prevTop = prevY;
      const prevRight = prevX + player.w;
      const prevLeft = prevX;

      if (prevBottom <= p.y + 4 && player.vy >= 0){
        player.y = p.y - player.h;
        player.vy = 0;
        player.onGround = true;
      } else if (prevTop >= p.y+p.h-4 && player.vy < 0){
        player.y = p.y + p.h;
        player.vy = 0.5;
      } else if (prevRight <= p.x + 5 && player.vx > 0){
        player.x = p.x - player.w;
        player.vx = 0;
      } else if (prevLeft >= p.x+p.w-5 && player.vx < 0){
        player.x = p.x + p.w;
        player.vx = 0;
      }
    }
  }

  function update(dt){
    if (gameState !== 'playing') return;
    t += dt;
    const f = Math.min(2, dt / 16.6667);

    if (player.invincible > 0) player.invincible -= dt;
    if (shake > 0) shake -= dt;

    if (keys.left){ player.vx -= 0.62*f; player.facing = -1; }
    if (keys.right){ player.vx += 0.62*f; player.facing = 1; }
    if (!keys.left && !keys.right) player.vx *= Math.pow(0.82,f);
    player.vx = Math.max(-6.1,Math.min(6.1,player.vx));

    if (player.onGround) player.coyote = 115; else player.coyote -= dt;
    if (keys.jumpPressed) player.jumpBuffer = 130; else player.jumpBuffer -= dt;

    if (player.jumpBuffer > 0 && player.coyote > 0){
      player.vy = JUMP_SPEED;
      player.onGround = false;
      player.coyote = 0;
      player.jumpBuffer = 0;
    }

    if (!keys.jump && player.vy < -4) player.vy += JUMP_RELEASE_CUT*f;

    const prevX = player.x, prevY = player.y;
    player.vy = Math.min(MAX_FALL, player.vy + GRAVITY*f);
    player.x += player.vx*f;
    player.y += player.vy*f;

    resolvePlayerPlatforms(prevX, prevY);
    player.x = Math.max(0, Math.min(worldWidth-player.w, player.x));

    for (const c of level.coins){
      if (c.collected) continue;
      const box = {x:c.x-c.r,y:c.y-c.r,w:c.r*2,h:c.r*2};
      if (rectsOverlap(player,box)){
        c.collected = true;
        coinCount++;
        score += 100;
        updateHud();
      }
    }

    for (const e of level.enemies){
      if (!e.alive) continue;
      const ePrevX = e.x;
      e.x += e.vx*f;
      const foot = {x:e.x+3,y:e.y+e.h+2,w:e.w-6,h:5};
      const groundAhead = level.platforms.some(p => p.type==='ground' && rectsOverlap(foot,p));
      if (!groundAhead || e.x < 0 || e.x > worldWidth-e.w) e.vx *= -1;

      for (const p of level.platforms){
        if (rectsOverlap(e,p)){
          if (e.vx>0 && ePrevX+e.w<=p.x+5) {e.x=p.x-e.w;e.vx*=-1;}
          else if (e.vx<0 && ePrevX>=p.x+p.w-5) {e.x=p.x+p.w;e.vx*=-1;}
        }
      }

      if (rectsOverlap(player,e)){
        const playerBottom = player.y+player.h;
        if (player.vy>1.5 && playerBottom-e.y < 24){
          e.alive=false;
          player.vy=-9.2;
          score+=250;
          shake=120;
          updateHud();
        } else if (player.invincible<=0){
          hitPlayer();
        }
      }
    }

    if (player.y > H + 180) hitPlayer(true);

    if (player.x > 5920){
      score += 2000;
      updateHud();
      gameState='won';
      showEnd('스테이지 클리어!','깃발에 도착했습니다. 다시 한 번 더 도전해보세요.');
    }

    if (player.x > 2850) player.checkpoint = 3050;
    if (player.x > 4700) player.checkpoint = 4890;

    const targetCam = Math.max(0, Math.min(worldWidth-W, player.x - W*0.38));
    cameraX += (targetCam-cameraX)*0.09*f;
    keys.jumpPressed = false;
  }

  function hitPlayer(fell=false){
    if (gameState!=='playing') return;
    lives--;
    updateHud();
    shake=260;
    if (lives<=0){
      gameState='lost';
      showEnd('게임 오버','점수 ' + score + '점 · 코인 ' + coinCount + '개');
    } else {
      player.x = player.checkpoint || 100;
      player.y = 330;
      player.vx = 0;
      player.vy = fell ? -2 : -7;
      player.invincible = 1500;
      cameraX = Math.max(0,player.x-220);
    }
  }

  function showEnd(title, text){
    overlay.style.display='grid';
    overlay.querySelector('h1').textContent=title;
    overlay.querySelector('p').innerHTML=text;
    startBtn.textContent='다시 시작';
  }

  function drawRoundedRect(x,y,w,h,r,fill,stroke){
    ctx.beginPath();
    ctx.roundRect(x,y,w,h,r);
    if (fill){ctx.fillStyle=fill;ctx.fill();}
    if (stroke){ctx.strokeStyle=stroke;ctx.lineWidth=2;ctx.stroke();}
  }

  function drawCloud(x,y,s=1){
    ctx.fillStyle='rgba(255,255,255,.92)';
    ctx.beginPath();
    ctx.arc(x,y,23*s,0,Math.PI*2);
    ctx.arc(x+25*s,y-11*s,29*s,0,Math.PI*2);
    ctx.arc(x+57*s,y,22*s,0,Math.PI*2);
    ctx.rect(x,y,57*s,24*s);
    ctx.fill();
  }

  function drawBackground(){
    const grad = ctx.createLinearGradient(0,0,0,H);
    grad.addColorStop(0,palette.sky1);
    grad.addColorStop(1,palette.sky2);
    ctx.fillStyle=grad; ctx.fillRect(0,0,W,H);

    const par1 = cameraX*0.18;
    for(let i=-1;i<7;i++) drawCloud(i*270 - (par1%270) + 70, 75 + (i%3)*34, 0.8 + (i%2)*0.24);

    const par2 = cameraX*0.35;
    for(let i=-1;i<10;i++){
      const x=i*210-(par2%210);
      ctx.fillStyle=i%2?palette.hill:palette.hill2;
      ctx.beginPath();
      ctx.moveTo(x-40,H-75);
      ctx.quadraticCurveTo(x+50,H-230,x+145,H-75);
      ctx.closePath();ctx.fill();
    }

    ctx.fillStyle='rgba(255,255,255,.28)';
    for(let i=0;i<30;i++){
      const x=(i*143-(cameraX*0.12)%143+W)%W;
      const y=170+(i*67)%150;
      ctx.fillRect(x,y,3,3);
    }
  }

  function drawPlatform(p){
    const x=p.x-cameraX;
    if (x+p.w< -60 || x>W+60) return;
    if (p.type==='ground'){
      ctx.fillStyle=palette.ground;ctx.fillRect(x,p.y,p.w,p.h);
      ctx.fillStyle=palette.grass;ctx.fillRect(x,p.y,p.w,12);
      ctx.fillStyle='#69d46e';ctx.fillRect(x,p.y,p.w,4);
      ctx.fillStyle='rgba(70,36,22,.18)';
      for(let gx=0;gx<p.w;gx+=TILE){
        ctx.fillRect(x+gx+8,p.y+28,18,6);
        ctx.fillRect(x+gx+25,p.y+54,12,6);
      }
    } else if (p.type==='brick'){
      for(let bx=0;bx<p.w;bx+=48){
        ctx.fillStyle=palette.brick;ctx.fillRect(x+bx,p.y,46,46);
        ctx.strokeStyle=palette.brickDark;ctx.lineWidth=3;ctx.strokeRect(x+bx+1.5,p.y+1.5,43,43);
        ctx.fillStyle='rgba(255,255,255,.12)';ctx.fillRect(x+bx+7,p.y+7,31,5);
        ctx.strokeStyle=palette.brickDark;ctx.lineWidth=2;
        ctx.beginPath();ctx.moveTo(x+bx+23,p.y+2);ctx.lineTo(x+bx+23,p.y+20);ctx.moveTo(x+bx+2,p.y+23);ctx.lineTo(x+bx+46,p.y+23);ctx.stroke();
      }
    } else {
      for(let bx=0;bx<p.w;bx+=48){
        ctx.fillStyle=palette.question;ctx.fillRect(x+bx,p.y,46,46);
        ctx.strokeStyle=palette.questionDark;ctx.lineWidth=3;ctx.strokeRect(x+bx+1.5,p.y+1.5,43,43);
        ctx.fillStyle='#fff1a0';ctx.font='900 28px system-ui';ctx.textAlign='center';ctx.fillText('?',x+bx+23,p.y+33);
      }
    }
  }

  function drawCoin(c){
    if(c.collected) return;
    const x=c.x-cameraX;
    if(x<-30||x>W+30) return;
    const bob=Math.sin(t*0.006+c.bob)*5;
    ctx.save();ctx.translate(x,c.y+bob);
    const sx=0.65+Math.abs(Math.sin(t*0.009+c.bob))*0.35;
    ctx.scale(sx,1);
    ctx.fillStyle=palette.coin;ctx.beginPath();ctx.arc(0,0,c.r,0,Math.PI*2);ctx.fill();
    ctx.strokeStyle=palette.coin2;ctx.lineWidth=4;ctx.stroke();
    ctx.fillStyle='rgba(255,255,255,.75)';ctx.fillRect(-2,-7,4,12);
    ctx.restore();
  }

  function drawEnemy(e){
    if(!e.alive) return;
    const x=e.x-cameraX;
    if(x<-60||x>W+60)return;
    ctx.save();ctx.translate(x,e.y);
    const squish=1+Math.sin((t+e.x)*0.012)*0.035;
    ctx.scale(1,squish);
    ctx.fillStyle=palette.enemy;
    ctx.beginPath();ctx.roundRect(2,4,e.w-4,e.h-4,12);ctx.fill();
    ctx.fillStyle=palette.enemy2;
    ctx.beginPath();ctx.ellipse(9,e.h-1,10,5,0,0,Math.PI*2);ctx.ellipse(e.w-9,e.h-1,10,5,0,0,Math.PI*2);ctx.fill();
    ctx.fillStyle='#fff';ctx.fillRect(8,11,7,8);ctx.fillRect(e.w-15,11,7,8);
    ctx.fillStyle=palette.ink;ctx.fillRect(11,14,3,4);ctx.fillRect(e.w-14,14,3,4);
    ctx.restore();
  }

  function drawPlayer(){
    const x=player.x-cameraX, y=player.y;
    if(player.invincible>0 && Math.floor(player.invincible/80)%2===0) return;
    ctx.save();ctx.translate(x+player.w/2,y+player.h/2);ctx.scale(player.facing,1);ctx.translate(-player.w/2,-player.h/2);

    ctx.fillStyle=palette.blue;ctx.fillRect(8,22,19,18);
    ctx.fillStyle=palette.red;ctx.fillRect(5,8,25,19);
    ctx.fillStyle=palette.skin;ctx.fillRect(11,13,20,15);
    ctx.fillStyle=palette.red;ctx.fillRect(4,4,24,8);ctx.fillRect(20,1,9,6);
    ctx.fillStyle=palette.ink;ctx.fillRect(27,15,4,4);
    ctx.fillStyle=palette.red;ctx.fillRect(2,22,9,8);ctx.fillRect(26,23,8,7);
    ctx.fillStyle=palette.ink;ctx.fillRect(6,38,12,6);ctx.fillRect(22,38,12,6);
    ctx.fillStyle='#ffd34f';ctx.fillRect(9,23,3,3);ctx.fillRect(23,23,3,3);
    ctx.restore();
  }

  function drawFlag(){
    const f=level.flag;
    const x=f.x-cameraX;
    if(x<-80||x>W+120)return;
    ctx.fillStyle=palette.pole;ctx.fillRect(x,f.y,8,f.h);
    ctx.fillStyle='#f3cf35';ctx.beginPath();ctx.arc(x+4,f.y-8,10,0,Math.PI*2);ctx.fill();
    ctx.fillStyle=palette.flag;
    ctx.beginPath();ctx.moveTo(x+8,f.y+18);ctx.lineTo(x+98,f.y+42);ctx.lineTo(x+8,f.y+68);ctx.closePath();ctx.fill();
    ctx.fillStyle=palette.red;ctx.beginPath();ctx.arc(x+41,f.y+42,11,0,Math.PI*2);ctx.fill();
  }

  function drawDecor(){
    const bushes=[240,920,1750,2900,3700,4820,5750];
    for(const bx of bushes){
      const x=bx-cameraX;
      if(x<-120||x>W+120)continue;
      ctx.fillStyle='#2f9f51';
      ctx.beginPath();ctx.arc(x,H-82,24,0,Math.PI*2);ctx.arc(x+27,H-92,31,0,Math.PI*2);ctx.arc(x+59,H-82,25,0,Math.PI*2);ctx.fill();
    }
  }

  function draw(){
    ctx.save();
    if(shake>0){ctx.translate((Math.random()-.5)*8,(Math.random()-.5)*6)}
    drawBackground();
    drawDecor();
    for(const p of level.platforms) drawPlatform(p);
    for(const c of level.coins) drawCoin(c);
    for(const e of level.enemies) drawEnemy(e);
    drawFlag();
    drawPlayer();

    if(gameState==='playing'){
      const pct=Math.min(1,player.x/level.flag.x);
      ctx.fillStyle='rgba(0,0,0,.16)';ctx.fillRect(18,H-20,W-36,7);
      ctx.fillStyle='#fff';ctx.fillRect(18,H-20,(W-36)*pct,7);
    }
    ctx.restore();
  }

  function loop(now){
    const dt=Math.min(34,now-last);last=now;
    update(dt);draw();requestAnimationFrame(loop);
  }

  function begin(){
    resetLevel(false);
    gameState='playing';
    overlay.style.display='none';
    startBtn.textContent='게임 시작';
    canvas.focus?.();
  }

  startBtn.addEventListener('click',begin);

  const keyMap = {
    ArrowLeft:'left', KeyA:'left',
    ArrowRight:'right', KeyD:'right',
    ArrowUp:'jump', KeyW:'jump', Space:'jump'
  };

  window.addEventListener('keydown',e=>{
    if(e.code==='KeyR'){begin();return;}
    const k=keyMap[e.code];
    if(!k) return;
    e.preventDefault();
    if(k==='jump'&&!keys.jump) keys.jumpPressed=true;
    keys[k]=true;
    if(gameState==='menu' && k==='jump') begin();
  },{passive:false});

  window.addEventListener('keyup',e=>{
    const k=keyMap[e.code];if(!k)return;
    e.preventDefault();keys[k]=false;
  },{passive:false});

  document.querySelectorAll('.mkey').forEach(el=>{
    const k=el.dataset.key;
    const down=e=>{e.preventDefault();if(k==='jump'&&!keys.jump)keys.jumpPressed=true;keys[k]=true;if(gameState==='menu')begin();};
    const up=e=>{e.preventDefault();keys[k]=false;};
    el.addEventListener('pointerdown',down);
    el.addEventListener('pointerup',up);
    el.addEventListener('pointercancel',up);
    el.addEventListener('pointerleave',up);
  });

  resetLevel(false);
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
